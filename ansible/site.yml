---
- name: Configure and deploy the DevOps VM
  hosts: vm
  become: true
  pre_tasks:
    - name: Validate the deployment tag before making changes
      ansible.builtin.assert:
        that:
          - app_tag is match('^[0-9a-f]{40}$')
        fail_msg: "Set DEVOPS_APP_SHA or pass -e app_tag=<full published SHA>."
  roles:
    - base
    - ssh
    - nginx
    - app
